services:
  # Contenedor único: Next.js
  # (Firebase vive en la nube, no necesita contenedor local)
  app:
    build: .
    container_name: academia_app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    networks:
      - academia_network

