<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OperoEducator - iOS Premium</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'] },
                    colors: {
                        brand: { 500: '#f97316', 400: '#fb923c' }, 
                        accent: { 400: '#fbbf24' } 
                    }
                }
            }
        }
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f8fafc; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass { background: rgba(255, 255, 255, 0.80); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgba(226, 232, 240, 0.6); }
        .glass-bottom { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid rgba(226, 232, 240, 0.6); padding-bottom: env(safe-area-inset-bottom); }
        .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px; }
        th, td { white-space: nowrap; }
    </style>
</head>
<body class="text-slate-900 bg-slate-50 antialiased selection:bg-brand-200">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4Sx2o2yL3DxkxmcTLwZbTufo53PCZTZw",
            authDomain: "operoeducator.firebaseapp.com",
            projectId: "operoeducator",
            storageBucket: "operoeducator.firebasestorage.app",
            messagingSenderId: "641954371656",
            appId: "1:641954371656:web:11b2f0caf5d588b495a07d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.firebaseAPI = {
            login: (email, password) => signInWithEmailAndPassword(auth, email, password),
            logout: () => signOut(auth),
            onAuthStateChanged: (callback) => onAuthStateChanged(auth, callback),
            loadData: async () => {
                try {
                    const docSnap = await getDoc(doc(db, "academia", "datos_centrales"));
                    return docSnap.exists() ? docSnap.data() : null;
                } catch (e) { console.error("Error al cargar:", e); return null; }
            },
            saveData: async (data) => {
                try { await setDoc(doc(db, "academia", "datos_centrales"), data); } 
                catch (e) { console.error("Error al guardar:", e); alert("Error de conexión al guardar.");}
            },
            uploadReceipt: async (file, pathName) => {
                const storageRef = ref(storage, pathName);
                await uploadBytes(storageRef, file);
                return await getDownloadURL(storageRef);
            }
        };
        window.dispatchEvent(new Event('firebaseReady'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CORREO_ADMINISTRADOR = "christan1402@gmail.com"; 
        const SUCURSALES = ['Muermos', 'Puerto Montt', 'Osorno', 'Valdivia', 'Temuco'];

        const Icon = ({ name, size=20, className="" }) => {
            const icons = {
                dashboard: <path d="M3 3v18h18 M9 17l5-5 4 4 3-8" />,
                users: <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75" />,
                book: <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />,
                check: <path d="M20 6 9 17l-5-5" />,
                star: <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />,
                dollar: <path d="M12 2v20 M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />,
                settings: <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />,
                upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12" />,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3" />,
                trash: <React.Fragment><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></React.Fragment>,
                logout: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9" />,
                plus: <React.Fragment><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></React.Fragment>
            };
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{icons[name] || icons.dashboard}</svg>;
        };

        const Button = ({ children, onClick, variant="primary", className="", type="button", disabled=false }) => {
            const base = "px-5 py-3 font-semibold rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-2 text-sm disabled:opacity-50 disabled:active:scale-100 flex-shrink-0";
            const variants = {
                primary: "bg-gradient-to-r from-brand-500 to-accent-400 text-white shadow-lg shadow-brand-500/30 hover:shadow-brand-500/50",
                outline: "bg-white border border-slate-200 text-slate-700 hover:bg-slate-50",
                danger: "bg-rose-50 text-rose-600 border border-rose-100 hover:bg-rose-100",
                warning: "bg-amber-50 text-amber-600 border border-amber-100 hover:bg-amber-100",
                ghost: "bg-transparent text-slate-500 hover:bg-slate-100"
            };
            return <button type={type} onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${className}`}>{children}</button>;
        };

        const Card = ({ children, className="", title, subtitle, action }) => (
            <div className={`bg-white rounded-3xl p-5 md:p-6 shadow-xl shadow-slate-200/40 border border-slate-100 relative overflow-hidden ${className}`}>
                {(title || action) && (
                    <div className="flex justify-between items-start md:items-center mb-4 md:mb-6 relative z-10 flex-wrap gap-3">
                        <div className="flex-1 min-w-[50%]">
                            {subtitle && <p className="text-[9px] md:text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">{subtitle}</p>}
                            {title && <h3 className="text-lg md:text-xl font-light tracking-tight text-slate-900 leading-tight">{title}</h3>}
                        </div>
                        {action && <div className="w-full sm:w-auto">{action}</div>}
                    </div>
                )}
                <div className="relative z-10">{children}</div>
            </div>
        );

        const Modal = ({ title, onClose, children }) => (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm transition-opacity">
                <div className="bg-white w-full max-w-md rounded-[2rem] shadow-2xl p-6 relative animate-[fadeIn_0.2s_ease-out] max-h-[90vh] overflow-y-auto">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-xl font-light tracking-tight text-slate-900">{title}</h3>
                        <button onClick={onClose} className="p-2 bg-slate-50 rounded-full text-slate-400 hover:text-slate-700 active:scale-90"><Icon name="check" className="rotate-45" /></button>
                    </div>
                    {children}
                </div>
            </div>
        );

        const Input = ({ label, type="text", value, onChange, onBlur, placeholder, required, name, disabled=false, step, accept }) => (
            <div className="mb-4 w-full">
                <label className="block text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">{label}</label>
                <input name={name} type={type} step={step} accept={accept} value={value} onChange={onChange} onBlur={onBlur} placeholder={placeholder} required={required} disabled={disabled} className="w-full bg-slate-50 p-3 rounded-2xl border border-slate-200 focus:border-brand-400 focus:ring-4 focus:ring-brand-500/20 outline-none transition-all text-slate-900 text-sm disabled:opacity-50" />
            </div>
        );
        
        const Select = ({ label, value, onChange, options, required, name, disabled=false }) => (
            <div className="mb-4 w-full">
                <label className="block text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">{label}</label>
                <select name={name} value={value} onChange={onChange} required={required} disabled={disabled} className="w-full bg-slate-50 p-3 rounded-2xl border border-slate-200 focus:border-brand-400 focus:ring-4 focus:ring-brand-500/20 outline-none transition-all text-slate-900 text-sm disabled:opacity-50">
                    {options.map((opt, i) => <option key={i} value={opt.value}>{opt.label}</option>)}
                </select>
            </div>
        );

        // ==========================================
        // LÓGICA DE NEGOCIO PRINCIPAL
        // ==========================================
        const App = () => {
            const defaultPlanes = {
                Junior: [
                    { titulo: "Introducción", martes: "Introducción y Herramientas", miercoles: "Cortes Básicos y Tijera" },
                    { titulo: "Básicos", martes: "Fade Básico", miercoles: "Práctica Fade y Perfilado" }
                ],
                Senior: [
                    { titulo: "Avanzando Fade", martes: "Repaso Fade", miercoles: "Fade Avanzado (Skin Fade)" },
                    { titulo: "Estilos", martes: "Diseños Básicos", miercoles: "Barboterapia" },
                    { titulo: "Modernos", martes: "Corte Clásico Moderno", miercoles: "Texturizado" },
                    { titulo: "Prácticas", martes: "Práctica Intensiva 1", miercoles: "Práctica Intensiva 2" }
                ],
                Master: [
                    { titulo: "Color", martes: "Colorimetría Básica", miercoles: "Decoloración" },
                    { titulo: "Avanzado", martes: "Diseños 3D", miercoles: "Tijera Avanzada (Point Cutting)" },
                    { titulo: "Negocio", martes: "Asesoría de Imagen", miercoles: "Gestión de Barbería" },
                    { titulo: "Práctica I", martes: "Práctica Master", miercoles: "Práctica Master" },
                    { titulo: "Práctica II", martes: "Práctica Master", miercoles: "Práctica Master" },
                    { titulo: "Final", martes: "Práctica Master", miercoles: "Proyecto Final" }
                ]
            };

            const [db, setDb] = useState({ instructorNombre: "Instructor", alumnos: [], planes: defaultPlanes, profesores: [], cursoConfig: { Junior: { fechaInicio: '' }, Senior: { fechaInicio: '' }, Master: { fechaInicio: '' } } });
            
            const [view, setView] = useState('dashboard');
            const [activeCourseTab, setActiveCourseTab] = useState('Junior');
            const [activeAulaView, setActiveAulaView] = useState('asistencia');
            const [modal, setModal] = useState({ type: null, data: null }); 
            const [isLogin, setIsLogin] = useState(true);
            const [userId, setUserId] = useState(null);
            const [authError, setAuthError] = useState("");
            const [isLoading, setIsLoading] = useState(true);
            const [isUploading, setIsUploading] = useState(false); 
            
            // ROLES Y SEGURIDAD
            const [userRole, setUserRole] = useState(null); // 'admin' | 'instructor'
            const [userEmail, setUserEmail] = useState("");
            const [isReadOnlyMode, setIsReadOnlyMode] = useState(false); 
            const fileInputRef = useRef(null);
            const [sucursalActual, setSucursalActual] = useState(SUCURSALES[0]);

            // --- EFECTO DE AUTENTICACIÓN FIREBASE ---
            useEffect(() => {
                const initAuth = () => {
                    window.firebaseAPI.onAuthStateChanged(async (user) => {
                        if (user) {
                            setUserId(user.uid);
                            setUserEmail(user.email);
                            const isAdmin = user.email.toLowerCase() === CORREO_ADMINISTRADOR.toLowerCase();
                            setUserRole(isAdmin ? 'admin' : 'instructor');
                            if (isAdmin) setActiveAulaView('pagos');

                            let cloudData = await window.firebaseAPI.loadData();
                            if (!cloudData) {
                                cloudData = { instructorNombre: "Instructor", alumnos: [], planes: defaultPlanes, profesores: [], cursoConfig: { Junior: { fechaInicio: '', precio: '' }, Senior: { fechaInicio: '', precio: '' }, Master: { fechaInicio: '', precio: '' } } };
                            }
                            
                            if (!cloudData.profesores) cloudData.profesores = [];
                            if (!cloudData.instructorNombre) cloudData.instructorNombre = "Instructor";
                            if (!cloudData.cursoConfig) cloudData.cursoConfig = {};
                            ['Junior', 'Senior', 'Master'].forEach(c => {
                                if (!cloudData.cursoConfig[c]) cloudData.cursoConfig[c] = { fechaInicio: '', precio: '' };
                                if (typeof cloudData.cursoConfig[c].precio === 'undefined') cloudData.cursoConfig[c].precio = '';
                                
                                if (cloudData.planes && cloudData.planes[c] && cloudData.planes[c].length > 0 && typeof cloudData.planes[c][0] === 'string') {
                                    const newPlan = [];
                                    for (let i = 0; i < cloudData.planes[c].length; i += 2) {
                                        newPlan.push({
                                            titulo: `Semana ${Math.floor(i/2) + 1}`,
                                            martes: cloudData.planes[c][i],
                                            miercoles: cloudData.planes[c][i+1] || "Sin asignar"
                                        });
                                    }
                                    cloudData.planes[c] = newPlan;
                                }
                            });

                            cloudData.alumnos.forEach(a => {
                                if (!a.pagosDetalle) a.pagosDetalle = []; 
                                if (!a.evaluaciones) a.evaluaciones = []; 
                                if (!a.sucursal) a.sucursal = SUCURSALES[0];
                            });
                            
                            setDb(cloudData);
                            setIsLogin(false);
                        } else {
                            setDb({ instructorNombre: "Instructor", alumnos: [], planes: defaultPlanes, profesores: [], cursoConfig: { Junior: { fechaInicio: '' }, Senior: { fechaInicio: '' }, Master: { fechaInicio: '' } } });
                            setUserId(null); setUserRole(null); setUserEmail(""); setIsLogin(true); setIsReadOnlyMode(false);
                        }
                        setIsLoading(false);
                    });
                };

                if (window.firebaseAPI) initAuth();
                else window.addEventListener('firebaseReady', initAuth);
                return () => window.removeEventListener('firebaseReady', initAuth);
            }, []);

            const saveDB = (newDb) => {
                if(isReadOnlyMode) return alert("Estás en Modo Histórico (Solo Lectura). Sal de este modo para guardar cambios.");
                setDb(newDb);
                if (userId && window.firebaseAPI) window.firebaseAPI.saveData(newDb);
            };

            const handleLogin = (e) => {
                e.preventDefault(); setAuthError("Conectando...");
                window.firebaseAPI.login(e.target.email.value, e.target.password.value)
                    .catch(err => setAuthError("Error: Correo o contraseña incorrectos."));
            };

            const handleLogout = async () => {
                if(window.confirm("¿Seguro que deseas salir de tu cuenta?")) {
                    try {
                        setIsLoading(true);
                        await window.firebaseAPI.logout();
                        setIsLogin(true);
                        setUserId(null);
                        setUserRole(null);
                        window.location.reload();
                    } catch (error) {
                        console.error("Error cerrando sesión: ", error);
                        setIsLoading(false);
                        alert("Hubo un problema cerrando sesión. Intenta de nuevo.");
                    }
                }
            };

            const calcClases = (fechaStr) => {
                if(!fechaStr) return 0;
                let count = 0, curr = new Date(fechaStr), end = new Date();
                if(curr > end) return 0;
                curr.setHours(0,0,0,0); end.setHours(23,59,59,999);
                while(curr <= end) {
                    let d = curr.getDay(); if(d===2 || d===3) count++;
                    curr.setDate(curr.getDate() + 1);
                }
                return count;
            };

            const calcSemana = (curso) => Math.ceil(calcClases(db?.cursoConfig[curso]?.fechaInicio) / 2) || 0;
            
            const getClaseSugerida = (curso, sem) => {
                if(sem === 0) return "El curso no ha iniciado";
                const plan = db?.planes[curso];
                if (!plan) return "Sin plan";
                if (sem > plan.length) return "Curso Finalizado";
                
                const semanaActual = plan[sem - 1];
                const hoy = new Date().getDay(); 
                
                if (hoy === 2) return `(Martes) ${semanaActual.martes}`;
                if (hoy === 3) return `(Miércoles) ${semanaActual.miercoles}`;
                return `${semanaActual.titulo}`; 
            };

            const getProfName = (id) => db?.profesores.find(p=>p.id==id)?.nombre || "Sin Asignar";

            const recalcularEstadoPago = (pagos, curso, configActual) => {
                if (!pagos || pagos.length === 0) return 'Pendiente';
                
                const configuration = configActual || db.cursoConfig;
                const precioConfig = configuration?.[curso]?.precio;
                const precioTotalCurso = parseFloat(precioConfig);
                
                if (!isNaN(precioTotalCurso) && precioTotalCurso > 0) {
                    const totalAbonado = pagos.reduce((sum, p) => sum + (parseFloat(p.monto) || 0), 0);
                    if (totalAbonado >= precioTotalCurso) return 'Pagado';
                    if (totalAbonado > 0) return 'Parcial';
                    return 'Pendiente';
                }
                
                if (pagos.some(p => p.tipo === 'Ambos')) return 'Pagado';
                const tieneApartado = pagos.some(p => p.tipo === 'Apartado');
                const tieneMensualidad = pagos.some(p => p.tipo === 'Mensualidad');
                if(tieneApartado && tieneMensualidad) return 'Pagado';
                if(tieneMensualidad) return 'Pagado'; 
                if(tieneApartado) return 'Parcial';
                return 'Pendiente';
            };

            // ==========================================
            // VISTAS PARCIALES SEGÚN ROL
            // ==========================================
            const DashboardView = () => {
                if (userRole === 'admin') {
                    const alumnosAlDia = db.alumnos.filter(a=>a.pago==='Pagado').length;
                    const alumnosConDeuda = db.alumnos.filter(a=>a.pago!=='Pagado');

                    return (
                        <div className="space-y-6 md:space-y-8 animate-[fadeIn_0.3s_ease]">
                            <div className="header-top flex justify-between items-center flex-wrap gap-4">
                                <div>
                                    <h1 className="text-2xl md:text-3xl font-light tracking-tight text-slate-900">Panel de Director 📈</h1>
                                    <p className="text-slate-500 mt-1 text-xs md:text-sm">Visión General de la Academia Central</p>
                                </div>
                            </div>
                            
                            {isReadOnlyMode && (
                                <div className="bg-amber-100 border border-amber-200 text-amber-800 p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between shadow-sm gap-4">
                                    <div className="flex items-center gap-3">
                                        <Icon name="book" size={24}/>
                                        <div><h4 className="font-bold uppercase text-[10px] tracking-widest">Modo Histórico Activado</h4><p className="text-xs">Estás viendo un JSON antiguo.</p></div>
                                    </div>
                                    <Button variant="danger" className="!py-2 text-xs w-full md:w-auto" onClick={()=>window.location.reload()}>Salir del modo</Button>
                                </div>
                            )}

                            {/* 5 TARJETAS DE SUCURSALES */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                                {SUCURSALES.map(sucursal => {
                                    const alumnosSuc = db.alumnos.filter(a => a.sucursal === sucursal);
                                    const j = alumnosSuc.filter(a => a.curso === 'Junior').length;
                                    const s = alumnosSuc.filter(a => a.curso === 'Senior').length;
                                    const m = alumnosSuc.filter(a => a.curso === 'Master').length;
                                    return (
                                        <Card key={sucursal} className="border-t-4 border-brand-500 !p-4">
                                            <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 truncate" title={sucursal}>Sucursal: {sucursal}</h4>
                                            <div className="space-y-2 text-sm text-slate-700">
                                                <div className="flex justify-between items-center"><span className="opacity-80">Junior:</span> <b className="text-slate-900">{j} activos</b></div>
                                                <div className="flex justify-between items-center"><span className="opacity-80">Senior:</span> <b className="text-slate-900">{s} activos</b></div>
                                                <div className="flex justify-between items-center"><span className="opacity-80">Master:</span> <b className="text-slate-900">{m} activos</b></div>
                                            </div>
                                        </Card>
                                    )
                                })}
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6">
                                <Card title="Estado Financiero Global" subtitle="Pagos vs Deudas">
                                    <div className="grid grid-cols-2 gap-4 mt-4">
                                        <div className="bg-emerald-50 p-4 rounded-2xl border border-emerald-100 text-emerald-700">
                                            <p className="text-[10px] font-bold uppercase tracking-widest">Alumnos al día</p>
                                            <p className="text-3xl font-light">{alumnosAlDia}</p>
                                        </div>
                                        <div className="bg-rose-50 p-4 rounded-2xl border border-rose-100 text-rose-700">

                        try {
                            let parsedData = [];
                            if(file.name.endsWith('.csv')) {
                                const lines = evt.target.result.split('\n').filter(l => l.trim());
                                const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                                parsedData = lines.slice(1).map(l => {
                                    const vals = l.split(',');
                                    let obj = {};
                                    headers.forEach((h, i) => obj[h] = vals[i]?.trim());
                                    return obj;
                                });
                            } else {
                                parsedData = JSON.parse(evt.target.result);
                            }

                            const nuevosAlumnos = parsedData.map(a => ({
                                id: Date.now() + Math.random(),
                                nombre: a.nombre || a.Nombre || 'Sin Nombre',
                                telefono: a.telefono || a.tel || a.Telefono || '',

                                        <div>
                                            <p className="text-[10px] uppercase tracking-widest opacity-80 mb-1">Costo Total: ${precioCurso}</p>
                                            <p className="text-xs font-bold">Abonado hasta hoy: ${totalPagado}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="uppercase tracking-widest text-[9px] font-bold">Deuda Actual</p>
                                            <p className="text-2xl font-light tabular-nums text-rose-600">${deuda}</p>
                                        </div>
                                    </div>
                                )}
                                <form onSubmit={async e => {
                                    e.preventDefault();
                                    setIsUploading(true);
                                    const t = e.target;
                                    let compUrl = null;
                                    
                                    if (t.foto.files.length > 0) {
                                        try {
                                            const file = t.foto.files[0];
                                            compUrl = await window.firebaseAPI.uploadReceipt(file, `comprobantes/${al.id}_${Date.now()}_${file.name}`);
                                        } catch (error) {
                                            alert("Error subiendo la imagen. Revisa tu conexión o configuración de Firebase Storage.");
                                            setIsUploading(false);
                                            return;
                                        }
                                    }

                                    al.pagosDetalle.push({
                                        tipo:t.tipo.value, 
                                        metodo:t.metodo.value, 
                                        fecha:t.fecha.value, 
                                        monto: parseFloat(t.monto.value),
                                        comprobanteUrl: compUrl
                                    });
                                    al.pago = recalcularEstadoPago(al.pagosDetalle, al.curso, db.cursoConfig);
                                    saveDB({...db}); 
                                    setModal(null);
                                    setIsUploading(false);
                                }}>
                                    <Select label="Concepto" name="tipo" options={[{label:'Apartado de Cupo',value:'Apartado'},{label:'Mensualidad',value:'Mensualidad'},{label:'Ambos',value:'Ambos'}]}/>
                                    <div className="flex gap-4">
                                        <Select label="Método" name="metodo" options={[{label:'Efectivo',value:'Efectivo'},{label:'Transferencia',value:'Transferencia'},{label:'Tarjeta',value:'Tarjeta'}]}/>
                                        <Input type="number" step="any" label="Monto Pagado ($)" name="monto" placeholder="Ej. 25000" required />
                                    </div>
                                    <Input type="date" label="Fecha" name="fecha" required defaultValue={new Date().toISOString().split('T')[0]}/>
                                    <Input type="file" label="Subir Comprobante (Opcional)" name="foto" accept="image/*" />
                                    <Button type="submit" disabled={isUploading} className="w-full mt-4">
                                        {isUploading ? "Subiendo y guardando..." : "Confirmar Pago"}
                                    </Button>
                                </form>
                            </Modal>
                        );
                    })()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
